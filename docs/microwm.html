<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>microwm.py: a pixel world model on one page</title>
<meta name="description" content="The complete tinywmcraft world model in one Python file: tokenizer, world model, heads and training, under 250 lines.">
<meta name="theme-color" content="#0a0a0a">
<meta name="color-scheme" content="dark">
<meta property="og:type" content="article">
<meta property="og:url" content="https://maharishiva.github.io/tinywmcraft/microwm.html">
<meta property="og:title" content="microwm.py: a pixel world model on one page">
<meta property="og:description" content="Tokenizer, world model, heads and training in under 250 lines. Print it as a poster.">
<meta property="og:image" content="https://maharishiva.github.io/tinywmcraft/assets/play.gif">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 3 3'%3E%3Crect width='3' height='3' fill='%230a0a0a'/%3E%3Crect x='1' y='1' width='1' height='1' fill='%23ff6a13'/%3E%3C/svg%3E">
<style>
:root { --bg:#0a0a0a; --fg:#f0f0ee; --dim:#6a6a6a; --o:#ff6a13; --s:#a48bd0; --line:#1c1c1c; }
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--bg); color:var(--fg); font-family:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace; }
a { color:var(--o); text-decoration:none; } a:hover { text-decoration:underline; }
header { display:flex; flex-wrap:wrap; gap:4px 18px; align-items:baseline; padding:18px 24px 14px; font-size:13px; color:var(--dim); }
header b { color:var(--fg); font-size:15px; }
header .print { display:none; }
#code { columns:3; column-gap:28px; column-rule:1px solid var(--line); padding:4px 24px 32px; font-size:11px; line-height:1.45; }
.l { white-space:pre-wrap; overflow-wrap:anywhere; break-inside:avoid; padding-left:calc(var(--i) * 1ch + 4ch); text-indent:calc(var(--i) * -1ch - 4ch); }
.k { color:var(--o); } .c { color:var(--dim); } .s { color:var(--s); } .f { font-weight:700; }
@media (max-width:1180px) { #code { columns:2; } }
@media (max-width:720px) { #code { columns:1; font-size:12px; padding:4px 16px 28px; } header { padding:16px; } }
@media print {
  @page { size:A3 landscape; margin:9mm; }
  :root { --bg:#fff; --fg:#111; --dim:#8a8a8a; --o:#c2410c; --s:#6b4aa8; --line:#e2e2e2; color-scheme:light; background:#fff; }
  header { padding:0 0 3mm; font-size:9pt; } header b { font-size:11pt; }
  header a { display:none; } header .print { display:inline; }
  #code { columns:3; column-gap:7mm; padding:0; font-size:var(--pf, 7pt); line-height:1.25; }
}
</style>
</head>
<body>
<header>
<b>microwm.py</b>
<span id="n">loading…</span>
<span>the whole model: tokenizer, world model, heads, training. No custom kernels.</span>
<a href="./">← tinywmcraft</a>
<a href="https://github.com/Maharishiva/tinywmcraft/blob/main/microwm.py">github</a>
<span class="print">maharishiva.github.io/tinywmcraft</span>
</header>
<main id="code"></main>
<script>
const KW = new Set("False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield".split(" "));
const RE = /(#.*)|("""[\s\S]*?"""|'''[\s\S]*?'''|[rbfuRBFU]{0,2}"(?:\\.|[^"\\\n])*"|[rbfuRBFU]{0,2}'(?:\\.|[^'\\\n])*')|([A-Za-z_]\w*)/g;
const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);

function render(src) {
  src = src.replace(/\r/g, "").replace(/\n+$/, "");
  const segs = [];
  let i = 0, prev = "";
  for (const m of src.matchAll(RE)) {
    if (m.index > i) segs.push(["", src.slice(i, m.index)]);
    const c = m[1] ? "c" : m[2] ? "s" : KW.has(m[3]) ? "k" : (prev === "def" || prev === "class") ? "f" : "";
    segs.push([c, m[0]]);
    prev = m[3] || "";
    i = m.index + m[0].length;
  }
  segs.push(["", src.slice(i)]);
  const lines = [[]];
  for (const [c, s] of segs) s.split("\n").forEach((p, j) => {
    if (j) lines.push([]);
    if (p) lines.at(-1).push(c ? `<span class="${c}">${esc(p)}</span>` : esc(p));
  });
  const raw = src.split("\n"), ind = raw.map(l => l.match(/^ */)[0].length);
  document.getElementById("code").innerHTML = lines.map((l, j) => `<div class="l" style="--i:${ind[j]}">${l.join("") || " "}</div>`).join("");
  document.getElementById("n").textContent = `${lines.length} lines`;
  // print font size: the largest that fits three A3-landscape columns (366 pt wide, ~740 pt tall) on one page
  const rows = (f, C = Math.floor(366 / (.6 * f))) => raw.reduce((s, l, j) => s + 1 + Math.max(0, Math.ceil((l.length - C) / Math.max(C - ind[j] - 4, 10))), 0);
  let f = 8; while (f > 4.5 && rows(f) * 1.25 * f > 3 * 740) f -= .1;
  document.documentElement.style.setProperty("--pf", f.toFixed(1) + "pt");
}

(async () => {
  for (const u of ["https://raw.githubusercontent.com/Maharishiva/tinywmcraft/main/microwm.py", "../microwm.py"]) {
    try { const r = await fetch(u); if (r.ok) return render(await r.text()); } catch (e) {}
  }
  document.getElementById("n").textContent = "";
  document.getElementById("code").innerHTML = `Could not load microwm.py. Read it on <a href="https://github.com/Maharishiva/tinywmcraft/blob/main/microwm.py">GitHub</a>.`;
})();
</script>
</body></html>
